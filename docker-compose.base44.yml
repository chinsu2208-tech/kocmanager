services:
  web:
    image: node:20-bookworm-slim
    working_dir: /app
    restart: on-failure
    volumes:
      - ./koc-manager:/app
      # keep container node_modules separate from the bind mount so installs
      # don't fight the host filesystem
      - node_modules:/app/node_modules
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<600?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 90s

volumes:
  node_modules:
